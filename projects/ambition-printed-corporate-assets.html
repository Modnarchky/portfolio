<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://res.cloudinary.com/dkvnulmx9/image/upload/v1777386339/JG_Brand_Assets_Logo_bporus.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/projects.css">
    <link rel="stylesheet" href="../css/tags.css">
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    {% include analytics.html %}
</head>
<body data-project-id="ambition-printed-corporate-assets">
  <div id="cursor">😐</div>
  <header id="header"></header>
  <section id="breadcrumbs" class="container left">
   <nav>
     <a href="./">Home</a><span class="material-icons current">chevron_left</span>
     <a href="./projects" class="current">Projects</a><span class="material-icons">chevron_left</span>
     <span id="breadcrumbTitle"></span>
   </nav>
  </section>
  <section id="projects" class="container row left">
    <div class="row column-layout">
      <!-- LEFT IMAGE -->
      <div class="project-main-image" style="flex: 1">
       <div class="img-wrapper">
        <img src="https://res.cloudinary.com/dkvnulmx9/image/upload/v1783443635/Ambition_Tote-bag_Mockup_bicybx.png" class="open-lightbox-zoom">
       </div>
      </div> 
      <!-- RIGHT CONTENT -->
      <div class="column" style="flex: 1; gap: var(--space-3);">
        <div>
          <div id="project-header" class="column">
    <h2 id="projectTitle"></h2>
     <div id="projectTags" class="tag-spacer"></div>
     </div>
    </div>
        <div style="flex: 1; text-align: left;">
      <h3>Project Overview</h3>
      <p id="projectOverview"></p> 
    </div>
      </div>
    </div>
  </section> 
  <section class="project-details container left row column-layout">
    <div id="project-metadata" class="row column-layout">
          <div style="flex: 1;">
            <h4>My Role</h4>
            <p id="projectRole"></p>
          </div>
          <div style="flex: 1;">
            <h4>Deliverables</h4>
            <p id="projectDeliverables"></p>
          </div>
          <div style="flex: 1;">
      <h4>Tools</h4>
      <p id="projectTools"></p>
    </div>
    <div style="flex: 1;">
      <h4>Target Audience</h4>
      <p id="projectTargetAudience"></p>
    </div>
    </div>
  </section>
  <section class="project-details container">
    <hr>
  </section>
  <section class="project-details container left">
    <div>
      <h3>Printed Brand Assets</h3>
    </div>
    <div class="row column-layout">
      <div style="flex: 1">
        <h4>Tote Bag</h4>
        <div class="img-wrapper-full shadow" style="height: auto">
         <img src="https://res.cloudinary.com/dkvnulmx9/image/upload/v1783443635/Ambition_Tote-bag_Mockup_bicybx.png" class="open-lightbox-zoom">
        </div>
        <h4 style="margin-top: var(--space-6)"> Calendar</h4>
        <div class="img-wrapper-full shadow" style="height: auto">
         <img src="https://res.cloudinary.com/dkvnulmx9/image/upload/v1783443705/Calendar-Mockup_opened_vip6ri.png" class="open-lightbox-zoom">
        </div>
      </div>
      <div style="flex: 1">
        <h4> Standee</h4>
        <div class="img-wrapper-full shadow" style="height: auto">
          <img src="https://res.cloudinary.com/dkvnulmx9/image/upload/v1783443573/Portfolio-Presentation_HK-Standing-Banner_quised.jpg" class="open-lightbox-zoom">
        </div>
        <h4 style="margin-top: var(--space-6)"> Market Insights</h4>
        <div class="img-wrapper-full shadow" style="height: auto">
          <img src="https://res.cloudinary.com/dkvnulmx9/image/upload/v1783443768/Ambition_MI_2025_All_countries_wtgstf.jpg" class="open-lightbox-zoom">
        </div>
      </div>
    </div>
  </section>
  <div id="lightbox-compare" class="lightbox">
    <div class="before-after-container lightbox-compare-slider">
      <button class="lightbox-close" id="lightboxClose">
        <span class="material-icons">close</span>
      </button>
      <img id="lb-after" class="after-img">
      <div class="after-label">
        <h3>After</h3>
      </div>
      <div class="before-wrapper">
        <img id="lb-before" class="before-img">
        <div class="before-label">
          <h3>Before</h3>
        </div>
      </div>
      <input type="range" min="0" max="100" value="50" class="slider">
      <div class="slider-line"></div>
    </div></div>
    <div id="lightbox-zoom" class="lightbox-zoom">

  <div class="lightbox-zoom-content">

    <button class="lightbox-close" id="lightboxZoomClose">
      <span class="material-icons">close</span>
    </button>

    <div class="zoom-container">
      <img id="lightboxZoomImg" class="lightbox-zoom-img" src="" alt="">
    </div>

  </div>

</div>
  <script src="../javascript/base.js"></script>
  <script src="../reload.js"></script>
  <script src="../javascript/project-page.js"></script>
  <script src="../javascript/carousel.js"></script>
  <script src="../javascript/header.js"></script>
  <script src="../javascript/tags.js"></script>
  <script src="../javascript/lightbox.js"></script>
  <script src="../javascript/cursor.js"></script>
</body>
